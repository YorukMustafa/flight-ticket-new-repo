spring:
  application:
    name: flight-ticket-system
  datasource:
    url: jdbc:postgresql://localhost:5432/flightdb
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  messages:
    basename: messages
    encoding: UTF-8
    cache-duration: 3600

